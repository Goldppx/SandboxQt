name: Windows Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Package with windeployqt
      run: |
        # 创建一个发布文件夹
        mkdir publish
        # 先把生成的 exe 拷过去
        copy build\Release\SandboxQt.exe publish\
        # 运行部署工具，它会自动把所有依赖的 Qt dll、插件全塞进 publish 文件夹
        windeployqt --release --no-translations --no-opengl-sw publish\SandboxQt.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxWorld-Windows-Full-Package
        # 这次我们直接打包整个 publish 文件夹
        path: publish/
